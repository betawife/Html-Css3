<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3DRotate</title>
    <style>
        img{
            margin: 0 auto;
            display: block;
            width: 640px;
            height: 400px;
            perspective: 1000px;
        }
        img:hover{
            transform: rotateX(45deg);
            transition: all 1s;
        }
    </style>
</head>
<body>
    <img src="./images/20230308085904_eaf99.jpg" alt="测试图片" title="测试图片" />
</body>
</html>
