<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiGoods</title>
    <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }    
    .product {   /* 版心 */
            margin :50px auto;
            width: 1226px;
            height: 628px;
            background-color: #ffffffd2;
            
        }
        .product-left {       /* 左侧版面 */
            float: left;
            width: 234px;
            height: 628px;
            background-color: skyblue;
        }
        .product-right {     /* 右侧版面 */
            float: right;
            width: 978px;
            height: 628px;
            background-color: brown;
        }
        .product-right ul {
            list-style: none;
        }
        .product-right ul li {/* 右侧版面下的li */
            float: left;
            margin-right: 14px;
            margin-bottom: 14px;
            width: 234px;
            height: 300px;
            background-color: orange;   
            
            text-align: center;
            font-size: 20px;
            color: #fff;
        }
        .product-right ul li:nth-child(4n) {  /* 右侧版面下的li的第4n个 */
            margin-right: 0;
        }
        .product-right ul li a {  /* 右侧版面下的li的a */
            text-decoration: none;
            color: #fff;
        }

    </style>
</head>
<body>
    <!--版心：左，右（八个li）-->
    <div class="product">
        <div class="product-left">
            
        </div>
        <div class="product-right">
            <ul>
                <li><a href="#">小米手机</a></li>
                <li><a href="#">小米平板</a></li>
                <li><a href="#">小米笔记本</a></li>
                <li><a href="#">小米家居</a></li>
                <li><a href="#">小米电视</a></li>
                <li><a href="#">小米路由器</a></li>
                <li><a href="#">小米耳机</a></li>
                <li><a href="#">小米配件</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
