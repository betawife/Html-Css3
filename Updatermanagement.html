<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        li{
            list-style: none;
        }

        .box{
            margin:50px auto;
            width: 1200px;
            height: 418px;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .box ul{
            padding: 90px 40px 90px 60px;
            height: 418px;

            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-content: space-between;
            
        }
        .box ul li{
            width: 500px;
            height: 88px;

            display: flex;
        }
        .box ul li .img{
            width: 88px;
            height: 88px;
            margin-right: 15px;
            border-radius: 10px;
        }
        .box ul li .text h4{
            font-size: 20px;
            line-height: 40px;
            font-weight: 400;
            color: #333;
        }
        .box ul li .text p{
            font-size: 14px;
            line-height: 20px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="box">
        <ul>
            <li>
                <img class="img" src="#" alt="Image 1">
                <div class="text">
                    <h4>Title 1</h4>
                    <p>Description for title 1.</p>
                </div>
            </li>
            <li>
                <img class="img" src="#" alt="Image 2">
                <div class="text">
                    <h4>Title 2</h4>
                    <p>Description for title 2.</p>
                </div>
            </li>
            <li>
                <img class="img" src="#" alt="Image 3">
                <div class="text">
                    <h4>Title 3</h4>
                    <p>Description for title 3.</p>
                </div>
            </li>
            <li>
                <img class="img" src="#" alt="Image 4">
                <div class="text">
                    <h4>Title 4</h4>
                    <p>Description for title 4.</p>
                </div>
            </li>
        </ul>
    </div>
</body>
</html>
