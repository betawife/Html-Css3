<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    /*(内,id,类,标签) */
    /*(0,2,0,0) */                         /* 拥有最多的高优先级选择器 */
    #father  #son {
        color: red;
    }
    /*(0,1,1,1) */
    #father  p.c2{
        color: blue;
    }
    /*(0,0,2,2) */
    div.c1  p.c2 {
        color: green;
    }

    #father {
        color: yellow !important;      /* 重要性高，但<p>要使用的话要继承，优先级低 */
    }

    div#father.c1 {                      /* 在外层，<p>要使用的话需继承 */
        color: orange ;
    }
</style>
<body>
    <div id="father" class="c1">
        <p id="son" class="c2">
        文字颜色
        </p>
    </div>
</body>
</html>
