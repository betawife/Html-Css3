<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Producing</title>
    <style>
        div {
            width: 200px;
            height: 200px;
            background-color: #f0f0f0;

            border: 1px solid #ccc;
            margin: 20px auto;
            padding: 20px auto;
            border-radius: 10px;
        }

        div .son{
            width: 80px;
            height: 20px;
            background-color: orange;

            border: 1px solid red;
            margin: 20px auto;
            padding: 5px auto;

            text-align: center;
            border-radius: 10px;
            overflow: hidden;
            
        }

        img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin: 0 auto;
            display: block;  /* 将图像inline设置为块级元素， */
        }

        p {
            text-align: center;
            overflow: hidden;
        }

        a {
            text-decoration: none;
            color: #fff;
        }
        a:hover {
            color: #000;
        }
        
    </style>
</head>
<body>
    <div>
        <img src="./images/20230308085904_eaf99.jpg" alt="User Image" class="img">
        <p>用户18351</p>
        <div class="son"><a href="#" >点击登录</a> </div>
    </div>
    
    
</body>
</html>
